const PERIOD_LABEL = { daily: "今日", weekly: "本周", monthly: "本月" };
const PERIOD_ORDER = ["daily", "weekly", "monthly"];
const GAINED_LABEL = { daily: "今日", weekly: "本周", monthly: "本月" };
const SCOPE_LABEL = { quarterly: "季度", yearly: "年度" };
const SCOPE_ORDER = ["quarterly", "yearly"];

let state = { view: "list", period: "daily", scope: "quarterly", bucket: null, cat: "all", keyword: "" };

function fmt(n) {
  return typeof n === "number" ? n.toLocaleString("en-US") : "—";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function localTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function periods() {
  return PERIOD_ORDER.filter(function (p) { return DATA && DATA.periods && DATA.periods[p]; });
}

function categories() {
  return DATA && DATA.categories ? DATA.categories : {};
}

function statsData() {
  return (DATA && DATA.stats) || { quarterly: [], yearly: [] };
}

function scopes() {
  const s = statsData();
  return SCOPE_ORDER.filter(function (k) { return (s[k] || []).length; });
}

function buckets() {
  return statsData()[state.scope] || [];
}

function currentBucket() {
  const list = buckets();
  if (!list.length) return null;
  for (let i = 0; i < list.length; i++) {
    if (list[i].key === state.bucket) return list[i];
  }
  return list[0];
}

function renderViewTabs() {
  const box = document.getElementById("viewTabs");
  let html = '<button class="' + (state.view === "list" ? "on" : "") + '" data-view="list">榜单</button>';
  if (scopes().length) {
    html += '<button class="' + (state.view === "stats" ? "on" : "") + '" data-view="stats">统计</button>';
  }
  box.innerHTML = html;
  box.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.dataset.view;
      renderAll();
    });
  });
}

function renderTabs() {
  const box = document.getElementById("periodTabs");
  box.innerHTML = periods().map(function (p) {
    const on = p === state.period ? " on" : "";
    return '<button class="' + on.trim() + '" data-period="' + p + '">' +
           PERIOD_LABEL[p] + "</button>";
  }).join("");
  box.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.period = btn.dataset.period;
      renderAll();
    });
  });
}

function renderScopeTabs() {
  const box = document.getElementById("scopeTabs");
  box.innerHTML = scopes().map(function (s) {
    const on = s === state.scope ? " on" : "";
    return '<button class="' + on.trim() + '" data-scope="' + s + '">' +
           SCOPE_LABEL[s] + "</button>";
  }).join("");
  box.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.scope = btn.dataset.scope;
      state.bucket = null;
      renderAll();
    });
  });
}

function renderBucketChips() {
  const box = document.getElementById("bucketChips");
  const cur = currentBucket();
  box.innerHTML = buckets().map(function (b) {
    const on = cur && b.key === cur.key ? " on" : "";
    return '<button class="' + on.trim() + '" data-key="' + esc(b.key) + '">' +
           esc(b.label) + "</button>";
  }).join("");
  box.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.bucket = btn.dataset.key;
      renderAll();
    });
  });
}

function renderChips() {
  const box = document.getElementById("catChips");
  const cats = categories();
  let html = '<button class="' + (state.cat === "all" ? "on" : "") + '" data-cat="all">全部</button>';
  Object.keys(cats).forEach(function (key) {
    const on = state.cat === key ? " on" : "";
    html += '<button class="' + on.trim() + " cat-" + key + '" data-cat="' + key + '">' +
            esc(cats[key]) + "</button>";
  });
  box.innerHTML = html;
  box.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.cat = btn.dataset.cat;
      renderAll();
    });
  });
}

function matchKeyword(it) {
  const kw = state.keyword.trim().toLowerCase();
  if (!kw) return true;
  const hay = [it.full_name, it.description, it.description_zh, it.language]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(kw) !== -1;
}

function matchCat(it) {
  return state.cat === "all" || (it.categories || []).indexOf(state.cat) !== -1;
}

function currentItems() {
  const p = DATA && DATA.periods ? DATA.periods[state.period] : null;
  if (!p) return [];
  return (p.items || []).filter(function (it) {
    return matchCat(it) && matchKeyword(it);
  });
}

function currentRepos() {
  const b = currentBucket();
  if (!b) return [];
  return (b.repos || []).filter(function (it) {
    return matchCat(it) && matchKeyword(it);
  });
}

function card(it, period) {
  const parts = String(it.full_name || "").split("/");
  const owner = parts.length > 1 ? parts[0] + " /" : "";
  const repo = parts.length > 1 ? parts[1] : it.full_name;
  const zh = it.description_zh || "";
  const en = it.description || "";
  const rankCls = it.trend_rank <= 3 ? "rank top" : "rank";
  const tags = (it.categories || []).map(function (c) {
    const label = categories()[c] || c;
    return '<span class="tag ' + esc(c) + '">' + esc(label) + "</span>";
  }).join("");
  let meta = "<span>⭐ " + fmt(it.stars) + "</span>";
  if (it.stars_gained) {
    meta += '<span class="gain">+' + fmt(it.stars_gained) + " " + GAINED_LABEL[period] + "</span>";
  }
  if (it.language) meta += "<span>" + esc(it.language) + "</span>";
  return '<article class="card">' +
    '<div class="' + rankCls + '">' + esc(it.trend_rank) + "</div>" +
    '<div class="body">' +
      '<div class="title"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
        '<span class="owner">' + esc(owner) + "</span>" + esc(repo) + "</a></div>" +
      (zh ? '<p class="desc">' + esc(zh) + "</p>" : "") +
      (en ? '<p class="desc-en">' + esc(en) + "</p>" : "") +
      '<div class="meta">' + meta + tags + "</div>" +
    "</div></article>";
}

function renderList() {
  const list = document.getElementById("list");
  const items = currentItems();
  if (!items.length) {
    list.innerHTML = '<div class="empty">没有符合条件的项目</div>';
  } else {
    list.innerHTML = items.map(function (it) { return card(it, state.period); }).join("");
  }
  document.getElementById("count").textContent = "共 " + items.length + " 个项目";
  const p = DATA && DATA.periods ? DATA.periods[state.period] : null;
  document.getElementById("updated").textContent =
    p && p.fetched_at ? "数据时间：" + localTime(p.fetched_at) : "";
}

function metric(label, value, hint) {
  return '<div class="metric"><span class="m-label">' + esc(label) + "</span>" +
         "<strong>" + esc(value) + "</strong>" +
         (hint ? '<span class="m-hint">' + esc(hint) + "</span>" : "") + "</div>";
}

function sparkline(history) {
  if (!history || history.length < 2) {
    return '<span class="spark-na" title="仅 1 天数据，需累积多天后生成曲线">—</span>';
  }
  const w = 96, h = 26, pad = 2;
  const vals = history.map(function (p) { return Number(p[1]) || 0; });
  const min = Math.min.apply(null, vals);
  const max = Math.max.apply(null, vals);
  const span = max - min;
  const step = (w - pad * 2) / (history.length - 1);
  const pts = vals.map(function (v, i) {
    const x = pad + i * step;
    const y = span === 0 ? h / 2 : pad + (1 - (v - min) / span) * (h - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const first = history[0];
  const last = history[history.length - 1];
  const delta = (Number(last[1]) || 0) - (Number(first[1]) || 0);
  const cls = delta > 0 ? "spark-up" : (delta < 0 ? "spark-down" : "spark-flat");
  const tip = first[0] + " " + fmt(first[1]) + " → " + last[0] + " " + fmt(last[1]);
  return '<svg class="spark ' + cls + '" viewBox="0 0 ' + w + " " + h +
    '" width="' + w + '" height="' + h + '" role="img" aria-label="' + esc(tip) + '">' +
    "<title>" + esc(tip) + "</title>" +
    '<polyline points="' + pts + '" /></svg>' +
    '<span class="spark-delta">' + (delta > 0 ? "+" : "") + fmt(delta) + " ⭐</span>";
}

function statRow(it) {
  const tags = (it.categories || []).map(function (c) {
    return '<span class="tag ' + esc(c) + '">' + esc(categories()[c] || c) + "</span>";
  }).join(" ");
  const desc = it.description_zh || it.description || "";
  const rankCls = it.rank <= 3 ? "c-rank top" : "c-rank";
  return "<tr>" +
    '<td class="' + rankCls + '">' + esc(it.rank) + "</td>" +
    '<td class="c-repo"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      esc(it.full_name) + "</a>" + (desc ? '<div class="r-desc">' + esc(desc) + "</div>" : "") + "</td>" +
    '<td class="num">' + esc(it.days) + " 天</td>" +
    '<td class="num gain">' + (it.gained ? "+" + fmt(it.gained) : "—") + "</td>" +
    '<td class="num">' + (it.best_rank ? "#" + esc(it.best_rank) : "—") + "</td>" +
    '<td class="c-spark">' + sparkline(it.history) + "</td>" +
    '<td class="c-tags">' + (tags || "—") + "</td>" +
  "</tr>";
}

function renderStats() {
  const view = document.getElementById("statsView");
  const bucket = currentBucket();
  if (!bucket) {
    view.innerHTML = '<div class="empty">暂无统计数据，等待每日归档累积后自动生成</div>';
    document.getElementById("count").textContent = "";
    document.getElementById("updated").textContent = "";
    return;
  }
  const s = bucket.summary || {};
  const cats = s.categories || {};
  const repos = currentRepos();
  const catKeys = Object.keys(categories());
  let summary = metric("覆盖天数", (s.days || 0) + " 天", "基于每日榜单归档");
  summary += metric("上榜仓库", fmt(s.repos || 0) + " 个", bucket.label);
  summary += metric("累计增星", "+" + fmt(s.gained || 0), "每日新增星数求和");
  summary += metric("主力语言", s.top_language || "—", "按上榜仓库数统计");
  catKeys.forEach(function (key) {
    summary += metric((categories()[key] || key) + " 仓库", fmt(cats[key] || 0) + " 个",
                      "占全部 " + (s.repos || 0) + " 个");
  });

  const rows = repos.map(statRow).join("");
  const table = repos.length
    ? '<div class="tablewrap"><table class="rank-table"><thead><tr>' +
      "<th>#</th><th>仓库</th><th class=\"num\">上榜天数</th>" +
      "<th class=\"num\">累计增星</th><th class=\"num\">最佳排名</th><th>星标趋势</th><th>分类</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>"
    : '<div class="empty">没有符合条件的项目</div>';

  view.innerHTML = '<section class="summary">' + summary + "</section>" + table;
  document.getElementById("count").textContent = "共 " + repos.length + " 个仓库 · 榜单前 " +
    (bucket.repos || []).length + " 名";
  const generated = statsData().generated_at;
  document.getElementById("updated").textContent =
    (generated ? "统计时间：" + localTime(generated) : "") + " · " + bucket.label;
}

function applyVisibility() {
  const isStats = state.view === "stats";
  document.getElementById("periodTabs").hidden = isStats;
  document.getElementById("scopeTabs").hidden = !isStats;
  document.getElementById("bucketChips").hidden = !isStats;
  document.getElementById("list").hidden = isStats;
  document.getElementById("statsView").hidden = !isStats;
}

function renderAll() {
  renderViewTabs();
  renderTabs();
  renderScopeTabs();
  renderBucketChips();
  renderChips();
  applyVisibility();
  if (state.view === "stats") renderStats();
  else renderList();
}

document.getElementById("search").addEventListener("input", function (e) {
  state.keyword = e.target.value;
  if (state.view === "stats") renderStats();
  else renderList();
});

if (!DATA || (!periods().length && !scopes().length)) {
  document.getElementById("viewTabs").innerHTML = "";
  document.getElementById("list").innerHTML =
    '<div class="empty">暂无数据，请先运行抓取脚本生成 index.html</div>';
} else {
  state.period = periods().indexOf("daily") !== -1 ? "daily" : (periods()[0] || "daily");
  state.scope = scopes()[0] || "quarterly";
  if (!periods().length) state.view = "stats";
  renderAll();
}
</script>
